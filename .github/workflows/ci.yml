name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Check dependency resolution
        run: uv pip check
      - name: Lint with Ruff
        run: uv run --no-sync ruff check .
      - name: Check formatting with Ruff
        run: uv run --no-sync ruff format --check .
      - name: Check types with Pyright
        run: uv run --no-sync pyright
      - name: Test with pytest
        run: uv run --no-sync python -W error::DeprecationWarning -m pytest -v -rfE --tb=long
